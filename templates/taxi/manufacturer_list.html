{% extends "base.html" %}
{% block content %}
  <h1>Manufacturer List</h1>
  {% if manufacturer_list %}
    <table class="table table-striped">
      <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
      </tr>
      </thead>
      <tbody>
        {% for manufacturer in manufacturer_list %}
          <tr>
            <td>{{ manufacturer.name }}</td>
            <td>{{ manufacturer.country }}</td>
          </tr>
        {% empty %}
          No manufacturer yet.
        {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
